[package]
name = "faber-cli"
description = "Faber on the command line for people and AI agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Shipped as `bin\faber.exe` beside the app. Named `faber-cli` here because the app's own program is already `faber`.
[[bin]]
name = "faber-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
faber-channel = { path = "../channel" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# The user's language when Settings follows the system.
faber-winproc = { path = "../winproc" }

[dev-dependencies]
tempfile = "3"
# The end-to-end tests serve a fake Faber while the program runs.
tokio = { version = "1", features = ["rt-multi-thread"] }
