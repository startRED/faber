[package]
name = "faber"
description = "One app for everything AI can do."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "faber"

[features]
# Test builds only (testkit/): a command the screen's checks report through, and the page that runs them. Never default.
test-hooks = []
# The manual webview spike only (examples/pane-spike-host.rs): Tauri's child webviews are behind its `unstable` feature.
pane-spike = ["tauri/unstable"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
faber-engine = { path = "../engine" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `unstable` gives the window a second webview, Faber's own browser pane (R161 step 7).
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the notification plugin; its Linux builder cannot suppress the desktop's own sound.
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
win32job = "2"
winsafe = { version = "0.0.29", features = ["gui"] }
# The browser pane drives its page through WebView2's own DevTools call (pane/native.rs); the same versions Tauri uses.
webview2-com = "0.39"
windows-core = "0.62"

# Only the Windows API files (awake.rs, autostart.rs, tray/native.rs, pane/native.rs) opt in to FFI; the engine and testkit keep the
# workspace's forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# Standard Rust cannot create junctions on stable; the overlap guard in update.rs is tested with one.
junction = "2"

[[example]]
name = "pane-spike-host"
required-features = ["pane-spike"]
