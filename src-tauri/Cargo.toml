[package]
name = "faber"
description = "One app for everything AI can do."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "faber"

[features]
# Test builds only (testkit/): a command the screen's checks report through, and the page that runs them. Never default.
test-hooks = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
faber-engine = { path = "../engine" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the notification plugin; its Linux builder cannot suppress the desktop's own sound.
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
win32job = "2"
winsafe = { version = "0.0.29", features = ["gui"] }

# Only the Windows API files (awake.rs, autostart.rs, tray/native.rs) opt in to FFI; the engine and testkit keep the
# workspace's forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# Standard Rust cannot create junctions on stable; the overlap guard in update.rs is tested with one.
junction = "2"
