name: Bug report
description: Report a bug or unexpected behavior in Faber
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, sign-in tokens or session credentials** in this form, in logs or in screenshots.
        To report a security vulnerability, do not use this form: report it privately through the Security tab, as
        described in [SECURITY.md](https://github.com/startRED/faber/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Faber version
      description: Shown in Settings, or in the release file name.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Optional technical details shown by Faber before opening this form.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system and install
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (.deb)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: Which CLI was involved?
      options:
        - Claude Code
        - Codex
        - Both (Claude Code and Codex)
        - None
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or other context
      description: Remove anything private first.
    validations:
      required: false
