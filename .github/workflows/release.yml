name: release

on:
  push:
    tags: ['v*']
  # auto-release.yml starts this on the tag it pushed, since a tag pushed by a workflow fires no push event.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job creates the release so the build jobs upload to it instead of racing to create it. It starts as a draft:
  # a published release with no latest.json yet makes every Faber get "not found" and skip the update.
  create:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      # The body is the English "what's new" entries newer than the previous release (scripts/release-notes.mjs), which is
      # why the whole history is fetched: the previous tag holds the last entry it shipped.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: release
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          node scripts/release-notes.mjs "$previous" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Faber $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --draft
          # The tags endpoint does not see drafts.
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # One build per chip: a universal build joins only the main binary, so bundling the second one (faber-local)
          # fails.
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: webview libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # The tag is the version; package.json only moves on hand-made bumps.
      - run: npm pkg set version="${GITHUB_REF_NAME#v}"
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; each build also merges its platform into the release's latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.create.outputs.id }}
          args: ${{ matrix.args }}

  # Publishes only after every platform uploaded and latest.json is there, so the updater never sees a release without
  # it. A failed platform leaves the draft for a person to look at.
  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[].name' | grep -qx latest.json
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create.outputs.id }}

  # Owner decision R110: main follows each published release. Fast-forward only; a main that moved on its own stops here.
  main:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/phase-1-base
          # main may already be past this tag: it also follows each green commit (R127).
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"
