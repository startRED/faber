name: ci

on:
  push:
    branches: [main, 'phase-*', 'queue/**']
  pull_request:
  # The land job starts a queue branch again by hand after rebasing it: a push made with this run's token starts nothing.
  workflow_dispatch:

# A newer push to the same pull request or queue branch makes its older run pointless. Pushes to the shared branches keep
# every run, so main can follow the newest green commit of phase-1-base (R127) even while pushes keep coming.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/queue/') }}

jobs:
  # A change of words only (docs/ or a .md file, scripts/ci-scope.mjs) needs no build: `cargo t` runs no suite for it either.
  # Such a push is green in seconds, but only when the commit before it is green already, so main never reaches unproven code
  # through a docs commit (R127, R163). Anything this job cannot tell for sure runs every check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          full() { echo "full=true" >> "$GITHUB_OUTPUT"; echo "Every check runs: $1"; exit 0; }
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" =~ [1-9a-f] ]] || full "there is no commit before this one"
          # Three dots: what HEAD changed since it left BEFORE. The API lists at most 300 files; more runs everything.
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD") || full "the change set could not be read"
          [ "$EVENT" = pull_request ] || [ "$(jq -r .status <<<"$compare")" = ahead ] || full "the push rewrote history"
          [ "$(jq '.files | length' <<<"$compare")" -lt 300 ] || full "300 files or more changed"
          jq -r '.files[].filename' <<<"$compare" | node scripts/ci-scope.mjs || full "not only words"
          if [ "$EVENT" = push ]; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&status=success" --jq .total_count) || full "the checks of $BEFORE could not be read"
            [ "$green" -gt 0 ] || full "the commit before, $BEFORE, is not green (yet)"
          fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "The build and the suites are skipped."

  # The jobs run at once and each takes about the same time, so the slowest sets the wait (R129). The screen suite is
  # dealt into six parts by CI seconds (testkit/src/screen/mod.rs, `SLOW`); the other suites are split by what they
  # build, so no job builds everything.
  check:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: check (${{ matrix.os }}, ${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, part: lints ui }
          - { os: windows-latest, part: rust }
          - { os: macos-latest, part: lints ui }
          - { os: macos-latest, part: rust }
          - { os: windows-latest, part: screen, shard: 1/6 }
          - { os: windows-latest, part: screen, shard: 2/6 }
          - { os: windows-latest, part: screen, shard: 3/6 }
          - { os: windows-latest, part: screen, shard: 4/6 }
          - { os: windows-latest, part: screen, shard: 5/6 }
          - { os: windows-latest, part: screen, shard: 6/6 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # One cache per part: the parts build different things (Clippy's metadata and the test app, the test programs, the
      # test app alone). With one shared key the first job to finish saved its own build and every other part rebuilt its
      # dependencies on each run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part == 'lints ui' && 'lints-ui' || matrix.part }}
      - run: npm ci
      - run: npm run build
      # bash stops at the first failing line; PowerShell would only report the last one.
      - if: contains(matrix.part, 'lints')
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm run test:scripts
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p faber --features test-hooks -- -D warnings
      # `rust` and `ui` run on every system; `screen` needs WebView2's DevTools port, so only Windows runs it.
      # Building apart from running shows on the job page how much of the Rust suite is the compiler (R163).
      - if: contains(matrix.part, 'rust')
        run: cargo test --workspace --no-run
      - if: contains(matrix.part, 'rust')
        run: cargo t --suite rust
      - if: contains(matrix.part, 'ui')
        run: cargo t --suite ui
      - if: matrix.part == 'screen'
        run: cargo t --suite screen --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ runner.os }}-${{ strategy.job-index }}
          # The screen shows only failures; run.log has every line of the last `cargo t` (R154).
          path: |
            target/faber-test/shots/
            target/faber-test/run.log
          if-no-files-found: ignore

  # main follows every green phase-1-base commit on its own (R127), so nobody has to remember to move it.
  # Fast-forward only: a commit that is already in main, or a main that moved on its own, stops here without failing.
  # A run of words only skips `check` on purpose, which counts as green; a failed or cancelled `check` never does.
  main:
    needs: [changes, check]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/phase-1-base' &&
      needs.changes.result == 'success' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.full == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"

  # The queue (R162): a commit pushed to queue/<name> lands on phase-1-base only after every check passed on top of the
  # newest phase-1-base, so a commit that is red on one system never reaches the shared branch and never stalls the
  # releases behind it. One landing at a time. When phase-1-base moved while the checks ran, the commit is rebased onto it
  # and checked again; a conflict stops here and the queue branch waits for its author.
  # Green means what it means for main above: `check` passed, or a run of words only skipped it on purpose.
  land:
    needs: [changes, check]
    if: >-
      always() && startsWith(github.ref, 'refs/heads/queue/') && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.changes.outputs.full == 'false'))
    runs-on: ubuntu-latest
    concurrency:
      group: land
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=${GITHUB_REF#refs/heads/}
          git fetch --quiet origin phase-1-base main "$branch"
          # A newer push to the queue branch has its own run.
          if [ "$(git rev-parse "origin/$branch")" != "$GITHUB_SHA" ]; then echo "A newer commit is queued."; exit 0; fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/phase-1-base; then
            git push origin --delete "$branch"; echo "Already on phase-1-base."; exit 0
          fi
          if git merge-base --is-ancestor origin/phase-1-base "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/phase-1-base"
            # Green on top of the whole phase-1-base, so main follows at once (R127).
            if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then git push origin "$GITHUB_SHA:refs/heads/main"; fi
            git push origin --delete "$branch"
            # Pushes made with this token start no workflow, so the preview release is started by hand (R130, R156).
            gh workflow run auto-release.yml --ref phase-1-base -f sha="$GITHUB_SHA"
            echo "Landed $GITHUB_SHA."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rebase --quiet origin/phase-1-base; then
            echo "::error::$branch conflicts with phase-1-base. Rebase it by hand and push it again."; exit 1
          fi
          git push --force origin "HEAD:refs/heads/$branch"
          gh workflow run ci.yml --ref "$branch"
          echo "phase-1-base moved; $branch was rebased and is checked again."
