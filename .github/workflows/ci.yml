name: ci

on:
  push:
    branches: [main, 'phase-*', 'queue/**']
  pull_request:
  # The land job starts a queue branch again by hand after rebasing it: a push made with this run's token starts nothing.
  # The land and main jobs start a warm run on main the same way, and promote-stable.yml a full run on a preview tag.
  workflow_dispatch:
    inputs:
      warm:
        description: Only build, and save the Rust caches (main only)
        type: boolean
        default: false
  # Every suite once a day on main, whatever the queue skipped (R165).
  schedule:
    - cron: '17 6 * * *'

# A newer push to the same pull request or queue branch makes its older run pointless. Pushes to the shared branches keep
# every run, so main can follow the newest green commit of phase-1-base (R127) even while pushes keep coming.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/queue/') }}

jobs:
  # Which jobs this change needs, by testkit's own rules (testkit/suites.json, scripts/ci-scope.mjs, R163): the same
  # suites `cargo t` picks locally. Words only (docs/ or a .md file) need none. A push may skip a suite only when the
  # commit before it is green, so main never reaches unproven code (R127); a queue commit is compared with phase-1-base,
  # where it lands, and needs phase-1-base green the same way (R165). Anything this job cannot tell runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      lints: ${{ steps.decide.outputs.lints }}
      rust: ${{ steps.decide.outputs.rust }}
      ui: ${{ steps.decide.outputs.ui }}
      screen: ${{ steps.decide.outputs.screen }}
      app: ${{ steps.decide.outputs.app }}
      check: ${{ steps.decide.outputs.check }}
      matrix: ${{ steps.decide.outputs.matrix }}
      parts: ${{ steps.decide.outputs.parts }}
      tested: ${{ steps.decide.outputs.tested }}
      warm: ${{ steps.decide.outputs.warm }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci-scope.mjs
            testkit/suites.json
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WARM: ${{ github.event_name == 'workflow_dispatch' && inputs.warm && github.ref == 'refs/heads/main' }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          LIGHT: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' }}
        shell: bash
        run: |
          set -uo pipefail
          scope=""
          # A commit is green when a run of this workflow that checked that very commit passed: a push, a queue run, or one
          # started by hand. A pull request checks a merge commit instead, and a warm run of main checks nothing.
          green() {
            local count
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$1&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.event != "pull_request" and .head_branch != "main")] | length') || return 1
            [ "$count" -gt 0 ]
          }
          decide() {
            local base compare found
            if [[ "$GITHUB_REF" == refs/heads/queue/* ]]; then
              # Three dots: what the queue commit changes on top of phase-1-base, where the land job puts it (R162).
              compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/phase-1-base...$HEAD") || { echo "Everything runs: the change set could not be read"; return; }
              base=$(jq -r .merge_base_commit.sha <<<"$compare")
            else
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" =~ [1-9a-f] ]] || { echo "Everything runs: there is no commit before this one"; return; }
              # Three dots: what HEAD changed since it left BEFORE.
              compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$HEAD") || { echo "Everything runs: the change set could not be read"; return; }
              [ "$EVENT" = pull_request ] || [ "$(jq -r .status <<<"$compare")" = ahead ] || { echo "Everything runs: the push rewrote history"; return; }
              base=$BEFORE
            fi
            # The API lists at most 300 files; more runs everything.
            [ "$(jq '.files | length' <<<"$compare")" -lt 300 ] || { echo "Everything runs: 300 files or more changed"; return; }
            found=$(jq -r '.files[].filename' <<<"$compare" | node scripts/ci-scope.mjs) || { echo "Everything runs: the scope could not be read"; return; }
            if [ "$EVENT" != pull_request ] && grep -q '=false' <<<"$found"; then
              green "$base" || { echo "Everything runs: $base, the commit this one builds on, is not green (yet)"; return; }
            fi
            scope=$found
          }
          warm=false
          if [ "$WARM" = true ]; then
            warm=true
            echo "A warm run: it builds what the checks build and saves the Rust caches, and tests nothing"
            scope=$(printf 'lints=false\nrust=false\nui=false\nscreen=false')
          else
            decide
          fi
          [ -n "$scope" ] || scope=$(printf 'lints=true\nrust=true\nui=true\nscreen=true')
          # A pull request of this repository lands only through scripts/land.mjs, whose queue run checks the very commit
          # that lands, so its own run keeps only the lints (R-next). Dependabot's still runs every suite it needs.
          if [ "$LIGHT" = true ]; then
            echo "A pull request: the queue runs the suites on the commit that lands, so this run checks the lints only"
            scope=$(grep '^lints=' <<<"$scope"; printf 'rust=false\nui=false\nscreen=false')
          fi
          echo "$scope"
          get() { if grep -q "^$1=true$" <<<"$scope"; then echo true; else echo false; fi; }
          lints=$(get lints); rust=$(get rust); ui=$(get ui); screen=$(get screen)
          # `cache` names the Rust cache of each kind of job; the warm job below builds the same kinds under the same names.
          entries=()
          if [ "$lints" = true ]; then
            entries+=('{"os":"windows-latest","part":"lints","cache":"lints"}')
            # macOS has no screen suite; its job runs the ui suite next to the lints, so the test app is built there too.
            if [ "$ui" = true ]; then part='lints ui'; else part=lints; fi
            entries+=("{\"os\":\"macos-latest\",\"part\":\"$part\",\"cache\":\"lints-ui\"}")
          fi
          if [ "$rust" = true ]; then
            entries+=('{"os":"windows-latest","part":"rust","cache":"rust"}' '{"os":"macos-latest","part":"rust","cache":"rust"}')
          fi
          app=false
          if [ "$ui" = true ] || [ "$screen" = true ]; then app=true; fi
          check=false
          if [ ${#entries[@]} -gt 0 ]; then check=true; fi
          matrix=$(IFS=,; echo "{\"include\":[${entries[*]}]}")
          # The parts that run the Windows test app: the ui suite, and the screen suite in eight.
          parts=()
          if [ "$ui" = true ]; then parts+=('"ui"'); fi
          if [ "$screen" = true ]; then for i in 1 2 3 4 5 6 7 8; do parts+=("\"$i/8\""); done; fi
          tested=false
          if [ ${#parts[@]} -gt 0 ]; then tested=true; fi
          {
            echo "lints=$lints"; echo "rust=$rust"; echo "ui=$ui"; echo "screen=$screen"
            echo "app=$app"; echo "check=$check"; echo "matrix=$matrix"
            echo "parts=$(IFS=,; echo "[${parts[*]}]")"; echo "tested=$tested"; echo "warm=$warm"
          } >> "$GITHUB_OUTPUT"

  # The lints and the Rust suite, each its own job, on Windows and macOS (R129, R163).
  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    name: check (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # One cache per kind of job: each builds different things (Clippy's metadata, the test programs, the test app).
      # Only main saves (R165): a run reads the caches of its own branch and of main, and every branch that saved its own
      # pushed the others out of the 10 GB GitHub keeps.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run build
      # bash stops at the first failing line; PowerShell would only report the last one.
      - if: contains(matrix.part, 'lints')
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm run test:scripts
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p faber --features test-hooks -- -D warnings
      # Building apart from running shows on the job page how much of the Rust suite is the compiler (R163).
      - if: matrix.part == 'rust'
        run: cargo test --workspace --no-run
      - if: matrix.part == 'rust'
        run: cargo t --suite rust
      - if: contains(matrix.part, 'ui')
        run: cargo t --suite ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ runner.os }}-${{ strategy.job-index }}
          # The screen shows only failures; run.log has every line of the last `cargo t` (R154).
          path: |
            target/faber-test/shots/
            target/faber-test/run.log
          if-no-files-found: ignore

  # The Windows test app is built once and handed to the ui part and the eight screen parts (R163).
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # src-tauri/build.rs makes an empty dist/ when there is none, and the test build refuses a changed dist/.
      - run: npm run build
      - run: cargo t --build-only
      # Exactly the programs `--prebuilt` checks for (testkit/src/testbuild.rs, `built_programs`).
      - uses: actions/upload-artifact@v4
        with:
          name: test-app
          retention-days: 1
          path: |
            target/debug/faber-test.exe
            target/debug/fake-cli.exe
            target/debug/examples/cache_probe.exe
            target/faber-test/debug/faber.exe
            target/faber-test/debug/faber-local.exe
          if-no-files-found: error

  # How long each screen scenario took in the newest green runs, so the parts are dealt by today's seconds and not by a
  # table that ages (scripts/screen-costs.mjs, R165). It never fails: without the runs it hands on the table in the repo.
  costs:
    needs: changes
    if: needs.changes.outputs.screen == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/screen-costs.mjs
            testkit/screen-costs.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/screen-costs.mjs fetch > screen-costs.json
      - uses: actions/upload-artifact@v4
        with:
          name: screen-costs
          retention-days: 1
          path: screen-costs.json

  # The ui suite and the screen suite in eight parts, dealt by CI seconds. A part builds nothing: it runs the programs of
  # the app job. Node stays installed, and the Rust the runner image already has, because some scenarios run a project's
  # own checks; installing the newest Rust took each part 20 to 30 s.
  screen:
    needs: [changes, app, costs]
    if: >-
      always() && needs.changes.outputs.tested == 'true' && needs.app.result == 'success' &&
      (needs.costs.result == 'success' || (needs.costs.result == 'skipped' && needs.changes.outputs.screen == 'false'))
    name: ${{ matrix.part == 'ui' && 'ui' || format('screen ({0})', matrix.part) }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.parts) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: test-app
          path: target
      # `rustup run` hands the runner what `cargo t` would (RUSTUP_HOME, the toolchain): the sandbox has its own home, and a
      # mission proof (the canary) runs cargo inside it.
      - if: matrix.part == 'ui'
        run: rustup run stable ./target/debug/faber-test.exe --suite ui --prebuilt
      - if: matrix.part != 'ui'
        uses: actions/download-artifact@v4
        with:
          name: screen-costs
          path: target
      - if: matrix.part != 'ui'
        run: rustup run stable ./target/debug/faber-test.exe --suite screen --shard ${{ matrix.part }} --costs target/screen-costs.json --prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.part == 'ui' && 'log-ui' || format('log-screen-{0}', strategy.job-index) }}
          path: |
            target/faber-test/shots/
            target/faber-test/run.log
          if-no-files-found: ignore

  # A warm run (R165) builds on main what each kind of job builds and saves it as that kind's Rust cache, which every
  # branch, queue and pull request can read. The land and main jobs start one after main moves; the daily run saves too.
  # When main already holds a cache for the exact dependencies, the job restores it, sees it is current and stops.
  warm:
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    name: warm (${{ matrix.os }}, ${{ matrix.cache }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, cache: lints }
          - { os: macos-latest, cache: lints-ui }
          - { os: windows-latest, cache: rust }
          - { os: macos-latest, cache: rust }
          - { os: windows-latest, cache: app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
      - if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          npm ci
          npm run build
          case "${{ matrix.cache }}" in
            lints) cargo clippy --workspace --all-targets -- -D warnings; cargo clippy -p faber --features test-hooks -- -D warnings ;;
            lints-ui) cargo clippy --workspace --all-targets -- -D warnings; cargo clippy -p faber --features test-hooks -- -D warnings; cargo t --build-only ;;
            rust) cargo test --workspace --no-run; cargo build -p faber-testkit --bin faber-test ;;
            app) cargo t --build-only ;;
          esac

  # One check that is green only when CI is (R174): phase-1-base requires it, so a pull request set to merge by itself
  # lands the moment every part passed, and never on a red, cancelled or wrongly skipped one. Green means what it means
  # for main below: every job passed, or the plan left it out on purpose.
  gate:
    needs: [changes, check, app, screen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          APP: ${{ needs.app.result }}
          SCREEN: ${{ needs.screen.result }}
          PLAN_CHECK: ${{ needs.changes.outputs.check }}
          PLAN_APP: ${{ needs.changes.outputs.app }}
          PLAN_TESTED: ${{ needs.changes.outputs.tested }}
        shell: bash
        run: |
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          [ "$CHANGES" = success ] || { echo "::error::changes: $CHANGES"; exit 1; }
          ok "$CHECK" "$PLAN_CHECK" || { echo "::error::check: $CHECK"; exit 1; }
          ok "$APP" "$PLAN_APP" || { echo "::error::app: $APP"; exit 1; }
          ok "$SCREEN" "$PLAN_TESTED" || { echo "::error::screen: $SCREEN"; exit 1; }
          echo "Every part the plan chose passed."

  # main follows every green phase-1-base commit on its own (R127), so nobody has to remember to move it.
  # Fast-forward only: a commit that is already in main, or a main that moved on its own, stops here without failing.
  main:
    needs: gate
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/phase-1-base' &&
      needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then exit 0; fi
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"
          # A push made with this token starts no workflow, so main's warm run is started by hand (R165).
          gh workflow run ci.yml --ref main -f warm=true

  # The queue (R162): a commit pushed to queue/<name> lands on phase-1-base only after every check passed on top of the
  # newest phase-1-base, so a commit that is red on one system never reaches the shared branch and never stalls the
  # releases behind it. One landing at a time. When phase-1-base moved while the checks ran, the commit is rebased onto it
  # and checked again; a conflict stops here and the queue branch waits for its author.
  # Green is the gate's green. It runs after the gate, because phase-1-base takes only a commit whose gate passed.
  # queue/pr-<n> is a pull request that scripts/land.mjs squashed and numbered (docs/design.md#numbers): when it lands, its
  # branch moves to the landed commit so GitHub shows it merged, from the head that was squashed only (the commit's
  # Pull-request-head line), so a later push stops the landing instead of being lost. When phase-1-base moved, it is
  # squashed and numbered again on the new base rather than rebased, since its numbers would collide.
  land:
    needs: gate
    if: >-
      always() && startsWith(github.ref, 'refs/heads/queue/') && github.event_name != 'pull_request' &&
      needs.gate.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: land
    permissions:
      contents: write
      actions: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=${GITHUB_REF#refs/heads/}
          pr=""; oid=""
          if [[ "$branch" =~ ^queue/pr-([0-9]+)$ ]]; then
            pr=${BASH_REMATCH[1]}
            oid=$(git log -1 --format='%(trailers:key=Pull-request-head,valueonly)' "$GITHUB_SHA" | tr -d '[:space:]')
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin phase-1-base main "$branch"
          # A newer push to the queue branch has its own run.
          if [ "$(git rev-parse "origin/$branch")" != "$GITHUB_SHA" ]; then echo "A newer commit is queued."; exit 0; fi
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/phase-1-base; then
            git push origin --delete "$branch"; echo "Already on phase-1-base."; exit 0
          fi
          # A pull request lands only while it is open on phase-1-base and still at the head that was squashed: a close or
          # a later push stops it here, and its author queues it again.
          head=""
          if [ -n "$pr" ] && [ -n "$oid" ]; then
            head=$(gh pr view "$pr" --json state,isCrossRepository,baseRefName,headRefName,headRefOid --jq \
              "select(.state == \"OPEN\" and (.isCrossRepository | not) and .baseRefName == \"phase-1-base\" and .headRefOid == \"$oid\") | .headRefName")
            if [ -z "$head" ]; then
              git push origin --delete "$branch"
              echo "::warning::#$pr was closed, retargeted or pushed again after it was queued. Queue it again: node scripts/land.mjs $pr"
              exit 0
            fi
          fi
          if git merge-base --is-ancestor origin/phase-1-base "$GITHUB_SHA"; then
            # One atomic push moves the pull request's branch (so GitHub shows it merged) and phase-1-base together or not
            # at all: when the base moved meanwhile, both stay as they were and the landing below starts again.
            landed=false; before=$(git rev-parse origin/phase-1-base)
            if [ -n "$head" ]; then
              git push --atomic --force-with-lease="refs/heads/$head:$oid" origin \
                "$GITHUB_SHA:refs/heads/$head" "$GITHUB_SHA:refs/heads/phase-1-base" && landed=true
            else
              git push origin "$GITHUB_SHA:refs/heads/phase-1-base" && landed=true
            fi
            if [ "$landed" = true ]; then
              # Green on top of the whole phase-1-base, so main follows at once (R127).
              if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
                git push origin "$GITHUB_SHA:refs/heads/main"
                # Pushes made with this token start no workflow, so main's warm run is started by hand (R165).
                gh workflow run ci.yml --ref main -f warm=true
              fi
              git push origin --delete "$branch"
              # The same goes for the preview release (R130, R156).
              gh workflow run auto-release.yml --ref phase-1-base -f sha="$GITHUB_SHA"
              echo "Landed $GITHUB_SHA."; exit 0
            fi
            # Only a base that moved is worth another landing; any other refusal would only repeat itself.
            git fetch --quiet origin phase-1-base
            if [ "$(git rev-parse origin/phase-1-base)" = "$before" ]; then
              echo "::error::The push was refused although phase-1-base did not move; the push error is above."; exit 1
            fi
          fi
          if [ -n "$head" ]; then
            node scripts/land.mjs "$pr" --head "$oid"
            gh workflow run ci.yml --ref "$branch"
            echo "phase-1-base moved; #$pr was squashed and numbered again on it and is checked again."; exit 0
          fi
          if ! git rebase --quiet origin/phase-1-base; then
            echo "::error::$branch conflicts with phase-1-base. Rebase it by hand and push it again."; exit 1
          fi
          git push --force origin "HEAD:refs/heads/$branch"
          gh workflow run ci.yml --ref "$branch"
          echo "phase-1-base moved; $branch was rebased and is checked again."

  # A queued pull request (queue/pr-<n>) whose checks or landing failed says so on the pull request itself: a red `queue`
  # status on the head that was queued and a comment, which wake the session that opened it, so nobody watches the queue
  # (R-next). The fix is pushed to the pull request and queued again with scripts/land.mjs.
  report:
    needs: [gate, land]
    if: >-
      always() && startsWith(github.ref, 'refs/heads/queue/pr-') && github.event_name != 'pull_request' &&
      (needs.gate.result == 'failure' || needs.land.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ needs.gate.result == 'failure' && 'its checks failed' || 'it could not land on phase-1-base' }}
        run: |
          set -euo pipefail
          pr=${GITHUB_REF#refs/heads/queue/pr-}
          oid=$(git log -1 --format='%(trailers:key=Pull-request-head,valueonly)' "$GITHUB_SHA" | tr -d '[:space:]')
          if [ -z "$oid" ]; then echo "No Pull-request-head line: nothing to report."; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$oid" -f state=failure -f context=queue -f target_url="$RUN" \
            -f description="Queued, but $FAILED. Fix, push, then: node scripts/land.mjs $pr"
          gh pr comment "$pr" --body "Queued as \`$GITHUB_SHA\`, but $FAILED: $RUN. Push the fix, then queue it again with \`node scripts/land.mjs $pr\`."
