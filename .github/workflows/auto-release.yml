name: auto-release

# Owner decisions R130 and R156: every user-facing change ships on its own, as a preview. When CI goes green on phase-1-base
# and a feat, fix or perf commit landed since the last tag, that commit is tagged vX.Y.(Z+1)-preview.N, where vX.Y.Z is the
# newest stable tag and N counts the previews after it. People who opted in to previews get it through the built-in
# updater; everyone else gets the same commit when promote-stable.yml makes it stable. A finished area still gets its minor
# bump by hand (a plain vX.Y.0 tag).
#
# Version scheme: plain semver pre-releases. They sort below the release they precede (0.3.16-preview.9 < 0.3.16), which is
# the order the updater applies, and every bundle in tauri.conf.json accepts them. Windows MSI (WiX) would reject them
# because it wants numbers only; MSI is not built, and scripts/channel.test.mjs fails if it is ever added.
on:
  workflow_run:
    workflows: [ci]
    branches: [phase-1-base]
    types: [completed]
  # The queue's land job (ci.yml, R162) passes the commit it landed; by hand, the newest green push is used.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to release
        required: false

# Green runs that finish close together queue here; each one sees the tag the one before it pushed. promote-stable.yml has its
# own group on purpose: GitHub keeps one pending run per group and cancels the others, so sharing this one would let a queued
# preview cancel the pending weekly promotion (and the other way round). The two can then run at the same moment, which the
# tag step below tolerates: it reads the tags again just before tagging and retries when the push is refused.
concurrency:
  group: auto-release

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-1-base
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          set -euo pipefail
          sha=${GREEN_SHA:-$(gh run list --workflow ci.yml --branch phase-1-base --event push --status success --limit 1 --json headSha --jq '.[0].headSha')}
          # A tag on this commit or a later one means it is already covered; a late green run never tags old code with a newer number.
          if [ -z "$sha" ] || [ -n "$(git tag --list 'v*' --contains "$sha")" ]; then
            echo "No green commit after the newest tag."; exit 0
          fi
          # The nearest tag behind the commit, of either channel: a stable made from an older preview does not hide the commits
          # that landed after that preview.
          last=$(git describe --tags --abbrev=0 --match 'v*' "$sha")
          # Only commits that touch what ships count; a fix to the test runner changes nothing for the user.
          if ! node scripts/channel.mjs user-facing "$last" "$sha"; then
            echo "Nothing user-facing since $last."; exit 0
          fi
          # A promotion may tag a stable while this runs, which changes the number; a push of a tag that exists is refused, so the
          # tags are read again and the number worked out once more.
          for attempt in 1 2 3; do
            git fetch --quiet --tags --force origin
            if [ -n "$(git tag --list 'v*' --contains "$sha")" ]; then
              echo "A tag now covers $sha."; exit 0
            fi
            next=$(node scripts/channel.mjs next-preview)
            git tag "$next" "$sha"
            if git push origin "$next"; then break; fi
            git tag -d "$next"
            [ "$attempt" -lt 3 ]
          done
          # A tag pushed with this token starts no workflow, so the release is started by hand.
          gh workflow run release.yml --ref "$next"
          echo "Released $next at $sha."
