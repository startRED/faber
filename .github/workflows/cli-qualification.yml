name: cli-qualification

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
            triple: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            platform: linux-x64
            triple: x86_64-unknown-linux-musl
            suffix: ''
          - os: macos-latest
            platform: darwin-arm64
            triple: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      TRIPLE: ${{ matrix.triple }}
      EXE_SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check the contract checker
        run: node --test scripts/cli-qualification.test.mjs
      - name: Download exact official platform packages without lifecycle scripts
        run: |
          set -euo pipefail
          # Metadata selects candidates only. These packages never enter a Faber artifact or supported-version list.
          claude_version=$(npm view @anthropic-ai/claude-code@latest version)
          codex_version=$(npm view @openai/codex@latest version)
          [[ "$claude_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$codex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/candidates" --ignore-scripts --no-audit --no-fund --package-lock=false \
            "@anthropic-ai/claude-code-$PLATFORM@$claude_version" "@openai/codex@$codex_version-$PLATFORM"
          echo "CLAUDE_VERSION=$claude_version" >> "$GITHUB_ENV"
          echo "CODEX_VERSION=$codex_version" >> "$GITHUB_ENV"
          mkdir -p reports
      - name: Check Claude candidate without sign-in
        if: ${{ !cancelled() && env.CLAUDE_VERSION != '' }}
        run: |
          node scripts/cli-qualification.mjs claude \
            "$RUNNER_TEMP/candidates/node_modules/@anthropic-ai/claude-code-$PLATFORM/claude$EXE_SUFFIX" \
            "$CLAUDE_VERSION" "$GITHUB_WORKSPACE/reports/claude.json"
      - name: Check Codex candidate without sign-in
        if: ${{ !cancelled() && env.CODEX_VERSION != '' }}
        run: |
          node scripts/cli-qualification.mjs codex \
            "$RUNNER_TEMP/candidates/node_modules/@openai/codex/vendor/$TRIPLE/bin/codex$EXE_SUFFIX" \
            "$CODEX_VERSION" "$GITHUB_WORKSPACE/reports/codex.json"
      - name: Keep metadata receipts only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: cli-contracts-${{ matrix.platform }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
