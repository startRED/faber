# One pull request per ecosystem per week, into the integration branch. Each group takes every patch and minor update of
# its ecosystem and merges itself on green (tidy.yml); a major update comes alone and waits for a session.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: phase-1-base
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    target-branch: phase-1-base
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: phase-1-base
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
