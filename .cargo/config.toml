[alias]
# `cargo t` runs Faber's own test runner (testkit/). Without arguments it runs what the changed files need.
# The runner is compiled before it can choose half the cores, so that first build is capped at 4 jobs.
t = "run --quiet -j 4 --package faber-testkit --bin faber-test --"

# LLVM's linker ships with the Rust toolchain and links much faster than the Visual Studio one.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
