[workspace]
members = ["engine", "src-tauri", "testkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/startRED/faber"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line numbers for our own panics, no debug info for dependencies: smaller test programs, faster and lighter links.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
