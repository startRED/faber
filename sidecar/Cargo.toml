[package]
name = "faber-sidecar"
description = "Faber's engine and command table behind newline JSON, the process an Electron shell runs beside its window."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faber-sidecar"
path = "src/main.rs"

[dependencies]
faber-engine = { path = "../engine" }
faber-host = { path = "../host" }
faber-update = { path = "../update" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true
