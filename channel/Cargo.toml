[package]
name = "faber-channel"
description = "The local channel of Faber's command line: one connection per client, open only to the signed-in user."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The channel over Faber's own command table, for the process that runs the engine. The command line leaves it off.
host = ["dep:faber-host"]

[dependencies]
faber-host = { path = "../host", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
faber-winproc = { path = "../winproc" }

[target.'cfg(unix)'.dependencies]
# The user id a peer must share (`geteuid`), without unsafe code here.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
faber-engine = { path = "../engine" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Faber's real table over the channel, which needs the engine.
[[test]]
name = "host"
required-features = ["host"]
