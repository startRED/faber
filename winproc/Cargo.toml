[package]
name = "faber-winproc"
description = "The unsafe Windows calls Faber needs: running a suspended process after it joined its job, lowering its integrity and reading its image."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Not `[lints] workspace = true`: the workspace forbids unsafe code, and this crate exists to keep those calls in one place.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
