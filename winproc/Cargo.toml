[package]
name = "faber-winproc"
description = "Native process controls and protected handle-based file operations for Faber."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Not `[lints] workspace = true`: the workspace forbids unsafe code, and this crate exists to keep those calls in one place.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Globalization", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# The command line's named pipe (pipe.rs) is made here with a list that names only the signed-in user.
tokio = { version = "1", features = ["net"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "param"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt"] }
