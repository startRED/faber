[package]
name = "faber-engine"
description = "Faber's engine: drives the official AI CLIs and keeps the conversations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# R132: lets the qualification harness waive the R131 day-line margin for exactly one mission. Only `testkit` turns it on,
# and nothing in the shipped app calls it.
r132-harness = []

[dependencies]
# The existing workspace dependency supplies a safe native disk-space reading at build admission.
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
base64 = "0.22"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
# Safe directory-relative file operations; already used by the workspace's dependencies.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# Reads the resident memory of the test's own process (install_memory.rs); the workspace forbids the unsafe code a counting allocator needs.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3"
# The paused clock of the tests that wait out the router (30 s) and an answer's acknowledgement (5 s).
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
