[package]
name = "faber-engine"
description = "Faber's engine: drives the official AI CLIs and keeps the conversations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# One shared test program (tests/all.rs), plus cost tests and hostile Store fixtures that need their own process.
autotests = false

[dependencies]
# Every layer below the Engine; re-exported whole, so callers keep `faber_engine::model` and the like.
faber-engine-core = { path = "../engine-core" }
faber-engine-drivers = { path = "../engine-drivers" }
faber-winproc = { path = "../winproc" }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
base64 = "0.23"
chrono = "0.4"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tar = "0.4"
toml = "1.1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
faber-engine-core = { path = "../engine-core", features = ["test-support"] }
faber-engine-drivers = { path = "../engine-drivers", features = ["test-support"] }
# The tests parse exported Markdown as the export does.
pulldown-cmark = { version = "0.13", default-features = false }
# Reads the resident memory of the test's own process (install_memory.rs); the workspace forbids the unsafe code a counting allocator needs.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# The paused clock of the tests that wait out the router (2.5 s) and an answer's acknowledgement (5 s).
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Standard Rust cannot create junctions on stable, and symlinks require privileges on the maintainer's PC.
junction = "2"
# The tests end a CLI's whole tree through a job object, as the engine does.
win32job = "2"

[[test]]
name = "engine"
path = "tests/all.rs"

# These hostile Store fixtures must not poison other tests through the live-root registry.
[[test]]
name = "guarded_commands"
path = "tests/guarded_commands/main.rs"

[[test]]
name = "rewind"
path = "tests/rewind/main.rs"

[[test]]
name = "install_memory"
path = "tests/install_memory.rs"

[[test]]
name = "rewind_cost"
path = "tests/rewind_cost.rs"

[[test]]
name = "background_cost"
path = "tests/background_cost.rs"

[[test]]
name = "verify_cost"
path = "tests/verify_cost.rs"

[[test]]
name = "adopted_read_cost"
path = "tests/adopted_read_cost.rs"

[[test]]
name = "project_facts_cost"
path = "tests/project_facts_cost.rs"

[[test]]
name = "first_word_cost"
path = "tests/first_word_cost.rs"
