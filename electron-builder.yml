appId: io.github.startred.faber
productName: Faber
directories:
  output: release
files:
  - dist/**
  - package.json
afterPack: scripts/after-pack.cjs
electronLanguages: [en-US, pt-BR]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null
linux:
  target: [AppImage, deb]
  category: Development
publish:
  provider: github
  owner: startRED
  repo: faber
  releaseType: release
