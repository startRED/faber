[package]
name = "faber-testkit"
description = "Faber's own test runner, and the fake CLI it replays recordings with."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "faber-test"
path = "src/bin/faber-test.rs"

[[bin]]
name = "fake-cli"
path = "src/bin/fake-cli.rs"

[[bin]]
name = "faber-bench"
path = "src/bin/faber-bench.rs"

[[bin]]
name = "faber-standin"
path = "src/bin/faber-standin.rs"

[dependencies]
faber-engine = { path = "../engine" }
base64 = "0.23"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
winreg = "0.56"
faber-winproc = { path = "../winproc" }
winsafe = { version = "0.0.29", features = ["kernel", "user"] }

[dev-dependencies]
png = "0.18"
toml = "1.1"

[lints]
workspace = true
